<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1113" media="(prefers-color-scheme: dark)">
<meta name="description" content="雙北停車場查詢與停車計費追蹤">
<title>TPE Parking</title>

<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TPE Parking">

<link rel="stylesheet" href="app/css/style.css">
</head>
<body>

<!-- ============================================================
     圖示：全部用同一套線條圖示，線寬一致。
     刻意不用 emoji —— emoji 在 iPhone / Android / Windows
     長得都不一樣，而且自帶顏色會跟整體配色打架。
     ============================================================ -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <g id="i-lot" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="18" height="18" rx="4"/>
      <path d="M9 17V7h3.5a3 3 0 0 1 0 6H9"/>
    </g>
    <g id="i-timer" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="13" r="8"/>
      <path d="M12 9.5V13l2.5 1.5M9.5 2h5M18.5 6.5l1.5-1.5"/>
    </g>
    <g id="i-history" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 12a9 9 0 1 0 2.6-6.4M3 4v4h4"/>
      <path d="M12 8v4.5l3 1.8"/>
    </g>
    <g id="i-plus" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 5v14M5 12h14"/>
    </g>
    <g id="i-search" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/>
    </g>
    <g id="i-x" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 6l12 12M18 6 6 18"/>
    </g>
    <g id="i-star" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3.2 L14.7 8.9 L21 9.8 L16.5 14.2 L17.6 20.4 L12 17.5 L6.4 20.4 L7.5 14.2 L3 9.8 L9.3 8.9 Z"/>
    </g>
    <g id="i-back" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 5l-7 7 7 7"/>
    </g>
    <g id="i-nav" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3.5 11.2 20 4l-7.2 16.5-2-6.3z"/>
    </g>
    <g id="i-pin" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 21s7-5.6 7-11a7 7 0 1 0-14 0c0 5.4 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/>
    </g>
    <g id="i-edit" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 20h4L19 9a2.5 2.5 0 0 0-3.5-3.5L4.5 16.5z"/>
    </g>
    <g id="i-trash" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 7h16M9 7V5h6v2M6.5 7l.9 12.2a1.5 1.5 0 0 0 1.5 1.3h6.2a1.5 1.5 0 0 0 1.5-1.3L17.5 7"/>
    </g>
    <g id="i-target" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="2.2"/>
      <path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3"/>
    </g>
    <g id="i-download" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3v12M7.5 10.5 12 15l4.5-4.5M4 20h16"/>
    </g>
    <g id="i-upload" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 15V3M7.5 7.5 12 3l4.5 4.5M4 20h16"/>
    </g>
    <g id="i-info" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 7.8v.4"/>
    </g>
    <g id="i-top" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 19V6M6 12l6-6 6 6"/>
    </g>
    <g id="i-card" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2.5" y="5" width="19" height="14" rx="2.5"/>
      <path d="M2.5 9.5h19M6 15h3.5"/>
    </g>
    <g id="i-toilet" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="4.8" r="2.3"/>
      <path d="M9 20.5v-5.2H7.3l1.7-5a2 2 0 0 1 1.9-1.4h2.2a2 2 0 0 1 1.9 1.4l1.7 5H15v5.2z"/>
    </g>
    <g id="i-more" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 5.5v.01M12 12v.01M12 18.5v.01"/>
    </g>
  </defs>
</svg>

<!-- ============================================================ 標題列 -->
<header class="appbar">
  <div class="wrap appbar-inner">
    <!-- 返回鍵：只在詳情頁出現。用文字「返回」而不是單一個箭頭，比較好懂 -->
    <button class="back-btn" id="btnBack" hidden>
      <svg class="ic" viewBox="0 0 24 24"><use href="#i-back"/></svg>返回
    </button>

    <img src="icon.png" alt="" class="logo" id="logo">
    <h1 id="appTitle">TPE Parking</h1>

    <!-- 新增停車場：計劃書確認放在停車場分頁的右上角 -->
    <button class="icon-btn primary" id="btnAdd" aria-label="手動新增停車場">
      <svg class="ic" viewBox="0 0 24 24"><use href="#i-plus"/></svg>
    </button>
  </div>
</header>

<main class="wrap">

  <!-- ============================================================
       分頁 1：停車場
       ============================================================ -->
  <section class="page active" id="page-lots" role="tabpanel" aria-labelledby="tab-lots">

    <div class="search" id="searchBox">
      <svg class="ic s-icon" viewBox="0 0 24 24"><use href="#i-search"/></svg>
      <input type="search" id="q" placeholder="搜尋停車場名稱、地址或營運公司"
             autocomplete="off" aria-label="搜尋停車場">
      <button class="s-clear" id="qClear" aria-label="清除搜尋">
        <svg class="ic ic-sm" viewBox="0 0 24 24"><use href="#i-x"/></svg>
      </button>
    </div>

    <div class="filters" role="group" aria-label="篩選條件">
      <button class="chip" id="fNear" aria-pressed="false">
        <svg class="ic ic-sm" viewBox="0 0 24 24"><use href="#i-target"/></svg>離我最近
      </button>
      <button class="chip" data-filter="fav" aria-pressed="false">
        <svg class="ic ic-sm" viewBox="0 0 24 24"><use href="#i-star"/></svg>我的最愛
      </button>
      <button class="chip" data-filter="card" aria-pressed="false">信用卡優惠</button>
      <button class="chip" data-filter="toilet" aria-pressed="false">有廁所</button>
      <button class="chip" data-filter="open" aria-pressed="false">現在有營業</button>
      <button class="chip" data-filter="cap" aria-pressed="false">有每日上限</button>
      <button class="chip" data-filter="sure" aria-pressed="false">費率明確</button>
      <button class="chip" data-filter="mine" aria-pressed="false">我新增的</button>
    </div>

    <p class="result-count" id="count"></p>
    <div id="lots"></div>
  </section>

  <!-- ============================================================
       停車場詳情（點卡片進來，不是分頁）
       ============================================================ -->
  <section class="page" id="page-detail" role="region" aria-label="停車場詳情">
    <div id="detail"></div>
  </section>

  <!-- ============================================================
       分頁 2：計時中
       ============================================================ -->
  <section class="page" id="page-timer" role="tabpanel" aria-labelledby="tab-timer">
    <div id="timer"></div>
  </section>

  <!-- ============================================================
       分頁 3：歷史紀錄
       ============================================================ -->
  <section class="page" id="page-history" role="tabpanel" aria-labelledby="tab-history">
    <div class="page-head">
      <h2>停車歷史紀錄</h2>
      <div class="seg" id="rangeSeg" role="group" aria-label="統計範圍">
        <button data-range="month" aria-pressed="true">本月</button>
        <button data-range="year" aria-pressed="false">今年</button>
        <button data-range="all" aria-pressed="false">全部</button>
      </div>
    </div>
    <div id="history"></div>
  </section>

</main>

<!-- ============================================================ 底部分頁列 -->
<nav class="tabbar" role="tablist" aria-label="主要分頁">
  <button id="tab-lots" role="tab" aria-selected="true" data-tab="lots">
    <svg class="ic ic-lg" viewBox="0 0 24 24"><use href="#i-lot"/></svg><span>停車場</span>
  </button>
  <button id="tab-timer" role="tab" aria-selected="false" data-tab="timer">
    <svg class="ic ic-lg" viewBox="0 0 24 24"><use href="#i-timer"/></svg><span>計時中</span>
    <i class="badge" id="timerBadge" hidden></i>
  </button>
  <button id="tab-history" role="tab" aria-selected="false" data-tab="history">
    <svg class="ic ic-lg" viewBox="0 0 24 24"><use href="#i-history"/></svg><span>歷史紀錄</span>
  </button>
</nav>

<!-- ============================================================ 對話框與提示 -->
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-box">
    <div class="modal-grab"></div>
    <div class="modal-head">
      <h3 id="modalTitle"></h3>
      <button class="icon-btn" id="modalClose" aria-label="關閉">
        <svg class="ic" viewBox="0 0 24 24"><use href="#i-x"/></svg>
      </button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<!-- 往下滑一段之後才出現，點一下回到最上面 -->
<button class="to-top" id="toTop" hidden aria-label="回到最上方">
  <svg class="ic" viewBox="0 0 24 24"><use href="#i-top"/></svg>
</button>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="app/data/parking.js"></script>
<script src="app/js/fare-engine.js"></script>
<script src="app/js/store.js"></script>
<script src="app/js/app.js"></script>
</body>
</html>
